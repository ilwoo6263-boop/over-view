<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>over-view — See more of the world</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand">over-view</div>
      <p class="eyebrow">MOVE. LOOK UP.</p>
      <h1>이동하는 동안,<br /><span>세상을 한 번 더 보세요.</span></h1>
      <p class="hero-copy">Google Maps의 실제 경로를 따라가며, 지금 지나치기 아까운 풍경을 찾아드립니다.</p>
    </header>

    <section class="route-card" aria-label="이동 경로 입력">
      <label><span>출발지</span><input id="origin" value="여의도" placeholder="주소, 장소 또는 랜드마크" /></label>
      <div class="route-line" aria-hidden="true"></div>
      <label><span>도착지</span><input id="destination" value="잠실" placeholder="주소, 장소 또는 랜드마크" /></label>
      <div class="controls">
        <select id="mode" aria-label="이동수단">
          <option value="bus">🚌 대중교통</option>
          <option value="subway">🚇 지하철</option>
          <option value="walk">🚶 걷기</option>
          <option value="car">🚗 차량</option>
        </select>
        <button id="startBtn">실제 경로에서 볼거리 찾기</button>
      </div>
      <div class="map-status" id="mapStatus">Google Maps를 준비하고 있습니다.</div>
    </section>

    <section class="map-wrap" aria-label="실제 이동 경로">
      <div id="map" class="map"></div>
    </section>

    <div class="route-summary" id="routeSummary">경로를 준비하고 있습니다.</div>

    <section class="moment" id="moment" hidden>
      <div class="moment-badge">NOW · VIEW MOMENT</div>
      <h2 id="momentTitle">잠깐, 창밖을 보세요.</h2>
      <p id="momentText"></p>
      <div class="moment-meta" id="momentMeta"></div>
    </section>

    <section class="points-section">
      <div class="section-heading"><div><p class="eyebrow">YOUR ROUTE</p><h2>가는 길의 발견</h2></div><span id="resultCount">0 discoveries</span></div>
      <div id="points" class="points-grid"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
